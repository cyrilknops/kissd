    C9 24 9 27 11 29
    C7 31 8 36 12 39
    C18 44 26 48 32 48
    C38 48 46 44 52 39
    C56 36 57 31 53 29
    C55 27 55 24 52 21
    C46 15 36 16 32 24
    Z"/>

  <!-- Highlight on the lower lip. -->
  <path fill="#fff" opacity=".22" d="
    M18 35
    C24 39 28 41 32 41
    C36 41 40 39 46 35
    C40 41 36 43 32 43
    C28 43 24 41 18 35
    Z"/>
</svg>
